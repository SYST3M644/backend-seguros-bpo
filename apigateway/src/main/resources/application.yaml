server:
  port: 6464

spring:
  application:
    name: api-gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: ruta-ms-roles
              uri: lb://roles
              predicates:
                - Path=/api/roles,/api/roles/**

            - id: ruta-ms-usuarios
              uri: lb://usuarios
              predicates:
                - Path=/api/usuarios,/api/usuarios/**

            - id: ruta-ms-companias
              uri: lb://catalogos
              predicates:
                - Path=/api/companias,/api/companias/**

            - id: ruta-ms-tipos
              uri: lb://catalogos
              predicates:
                - Path=/api/tipos-siniestro,/api/tipos-siniestro/**

            - id: ruta-ms-regiones
              uri: lb://catalogos
              predicates:
                - Path=/api/regiones,/api/regiones/**

            - id: ruta-ms-siniestros
              uri: lb://siniestros
              predicates:
                - Path=/api/siniestros,/api/siniestros/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: api-gateway:${server.port}

logging:
  level:
    '[org.springframework.cloud.gateway]': INFO
